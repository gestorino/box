  header{padding:22px 16px 10px;border-bottom:1px solid var(--line);background:var(--panel)}

  header p{color:var(--ink2);font-size:12px;margin-top:2px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:var(--panel);
        border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch}
  .tab{flex:0 0 auto;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);
       font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.3px;cursor:pointer;white-space:nowrap;color:var(--ink2)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;padding:12px 16px;font-size:11px;color:var(--ink2)}
  .legend b{font-weight:500;color:var(--ink)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
  .dm{display:inline-block;width:9px;height:9px;transform:rotate(45deg);vertical-align:-1px;margin-right:6px;background:var(--gate)}
  .stage{padding:6px 8px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:10px auto;max-width:860px;overflow:hidden}
  .card .hd{padding:14px 16px 4px}
  .card .hd h2{font-family:var(--disp);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.4px}
  .card .hd .dom{color:var(--irrev);font-size:11px}
  .card .hd .why{color:var(--ink2);font-size:12px;margin-top:4px;max-width:640px}
  .svgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 6px 8px}
  svg{display:block;margin:0 auto}
  .pats{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 16px;border-top:1px dashed var(--line)}
  .pat{font-size:10.5px;padding:4px 9px;border-radius:4px;background:#EDF1F5;color:var(--ink2);border:1px solid var(--line)}
  .pat.new{background:#F6EFE4;border-color:#E3CFA6;color:#7A5A14}
  .pat.new::before{content:"NEW · ";font-weight:600}
  /* svg text */
  text{font-family:var(--mono)}
  .nl{font-size:12px;font-weight:600;fill:var(--ink)}
  .ns{font-size:9.5px;fill:var(--ink2)}
  .el{font-size:9.5px;fill:var(--ink2)}
  .gl{font-size:8.5px;fill:var(--gate);font-weight:600}

    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

// ---- renderer ----
const COLW=250, ROWH=104, NW=196, NH=52, PADX=26, PADY=26;
function px(n){return {x:PADX+n.x*COLW, y:PADY+n.y*ROWH};}

function edgePath(a,b,e){
  const A=px(a), B=px(b);
  const ax=A.x+NW/2, bx=B.x+NW/2;
  let sy=A.y+NH, ty=B.y, sx=ax, tx=bx;
  if(e.back){ // route around the side
    const side = (a.x>=b.x)? -1 : 1;
    const off = side*(NW/2+34);
    sx = ax+ (side>0? NW/2:-NW/2)-NW/2+NW/2; // start mid, exit side
    const x1 = Math.min(ax,bx)+ (side>0? Math.max(ax,bx)-Math.min(ax,bx)+NW/2+30 : -(NW/2+30));
    const exitX = ax + side*NW/2, entX = bx + side*NW/2;
    const sy2=A.y+NH/2, ty2=B.y+NH/2;
    return {d:`M ${exitX} ${sy2} C ${exitX+side*46} ${sy2}, ${entX+side*46} ${ty2}, ${entX} ${ty2}`,
            mid:{x:exitX+side*52, y:(sy2+ty2)/2}};
  }
  if(Math.abs(ax-bx)<2) return {d:`M ${sx} ${sy} L ${tx} ${ty}`, mid:{x:sx,y:(sy+ty)/2}};
  const my=(sy+ty)/2;
  return {d:`M ${sx} ${sy} C ${sx} ${my}, ${tx} ${my}, ${tx} ${ty}`, mid:{x:(sx+tx)/2,y:my}};
}

function nodeSVG(n){
  const p=px(n); let g='';
  const eff = n.eff? C[n.eff] : null;
  if(n.kind==='term'||n.kind==='handoff'){
    const col = n.kind==='term'?C.term:C.handoff;
    const dash = n.kind==='handoff'?'stroke-dasharray="5 4"':'';
    g+=`<rect x="${p.x+NW/2-78}" y="${p.y}" width="156" height="40" rx="20" fill="${n.kind==='term'?'#E7F2EA':'#fff'}" stroke="${col}" stroke-width="1.4" ${dash}/>
        <text class="nl" x="${p.x+NW/2}" y="${p.y+18}" text-anchor="middle" fill="${col}">${n.label}</text>
        <text class="ns" x="${p.x+NW/2}" y="${p.y+32}" text-anchor="middle">${n.sub||''}</text>`;
    return g;
  }
  const isStand=n.kind==='standing', isAwait=n.kind==='await';
  const stroke = isStand?C.standing:(isAwait?C.await:'#B9C4CD');
  const dash = isStand?'stroke-dasharray="6 4"':'';
  const accent = isAwait?C.await:(eff||C.none);
  g+=`<rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="4" fill="#fff" stroke="${stroke}" stroke-width="1.3" ${dash}/>
      <rect x="${p.x}" y="${p.y}" width="4" height="${NH}" rx="2" fill="${accent}"/>
      <text class="nl" x="${p.x+12}" y="${p.y+21}">${n.label}</text>
      <text class="ns" x="${p.x+12}" y="${p.y+37}">${n.sub||''}</text>`;
  if(isStand){ // loop glyph
    g+=`<text x="${p.x+NW-18}" y="${p.y+20}" font-size="13" fill="${C.standing}">⟳</text>`;
  }
  return g;
}

function render(gr){
  const maxY=Math.max(...gr.nodes.map(n=>n.y));
  const maxX=Math.max(...gr.nodes.map(n=>n.x));
  const W=PADX*2+maxX*COLW+NW, H=PADY*2+maxY*ROWH+NH+16;
  const nm=Object.fromEntries(gr.nodes.map(n=>[n.id,n]));
  let edges='',labels='',gates='';
  gr.edges.forEach(e=>{
    const {d,mid}=edgePath(nm[e.f],nm[e.t],e);
    const dash=e.dash?'stroke-dasharray="4 4"':'';
    edges+=`<path d="${d}" fill="none" stroke="${C.line}" stroke-width="1.6" ${dash} marker-end="url(#arr)"/>`;
    if(e.gate){
      gates+=`<g transform="translate(${mid.x},${mid.y}) rotate(45)">
              <rect x="-6" y="-6" width="12" height="12" fill="#fff" stroke="${C.gate}" stroke-width="1.6"/></g>
              <text class="gl" x="${mid.x+11}" y="${mid.y+3}">gate</text>`;
    }
    if(e.label){
      const dx=e.gate? 11+30 : 8;
      labels+=`<text class="el" x="${mid.x+dx}" y="${mid.y - (e.gate? -3 : 4)}">${e.label}</text>`;
    }
  });
  let nodes=''; gr.nodes.forEach(n=>nodes+=nodeSVG(n));
  return `<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W,860)}" style="min-width:${Math.min(W,560)}px">
    <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9AA8B4"/></marker></defs>
    ${edges}${gates}${labels}${nodes}</svg>`;
}

function card(gr){
  const pats=gr.pats.map(([t,nw])=>`<span class="pat${nw?' new':''}">${t}</span>`).join('');
  return `<section class="card" id="c-${gr.id}">
    <div class="hd"><div class="dom">${gr.dom}</div><h2>${gr.title}</h2><p class="why">${gr.why}</p></div>
    <div class="svgwrap">${render(gr)}</div>
    <div class="pats">${pats}</div>
  </section>`;
}

const tabs=document.getElementById('tabs'), stage=document.getElementById('stage');
GRAPHS.forEach((g,i)=>{
  const b=document.createElement('button'); b.className='tab'+(i===0?' on':''); b.textContent=g.tab;
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); b.classList.add('on'); show(g.id);};
  tabs.appendChild(b);
});
function show(id){ const g=GRAPHS.find(x=>x.id===id); stage.innerHTML=card(g); }
show('car');
</script>
</body>
</html>
