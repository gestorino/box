<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concierge Runner — Admin Console (mockups)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F7; --panel:#FFFFFF; --ink:#17242F; --ink2:#4A5B69; --ink3:#8595A2;
  --line:#D8DFE5; --line2:#EAEEF2;
  --none:#64748B; --rev:#B07A1E; --irrev:#C13A24; --await:#0E7C7B; --gate:#6D4AB0;
  --term:#2E7D4F; --standing:#2563A8; --ok:#2E7D4F; --warn:#B07A1E; --err:#C13A24;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:12.5px;line-height:1.5}
a{color:inherit}
button{font-family:var(--mono);font-size:11px;padding:5px 11px;border:1px solid var(--line);
  border-radius:4px;background:#fff;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--ink2)}
button:focus-visible{outline:2px solid var(--gate);outline-offset:1px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.danger{color:var(--err);border-color:#E4B7AE}
.badge15{font-size:9px;background:#EFE7F8;color:var(--gate);border:1px solid #D8C8EE;
  border-radius:3px;padding:1px 5px;vertical-align:2px;margin-left:6px}

/* shell */
.shell{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:18px 0}
.brand{padding:0 18px 16px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.brand h1{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.brand .sub{font-size:10px;color:var(--ink3)}
.brand .tun{margin-top:8px;font-size:10px;color:var(--ok)}
.brand .tun::before{content:"●";margin-right:5px}
.nav button{display:block;width:100%;text-align:left;border:none;border-radius:0;background:none;
  padding:9px 18px;font-family:var(--disp);font-size:15.5px;font-weight:600;letter-spacing:.4px;
  color:var(--ink2);border-left:3px solid transparent}
.nav button.on{color:var(--ink);border-left-color:var(--irrev);background:var(--paper)}
main{padding:20px 22px 60px;max-width:1060px}
.crumb{font-size:10px;color:var(--ink3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
h2{font-family:var(--disp);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px}
h3{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
   color:var(--ink2);margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.kv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--paper)}
.chip.dom{border-color:#E4B7AE;color:var(--irrev)}
.chip.state{border-color:#BFE0DE;color:var(--await);background:#EDF6F6}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
   color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)} .dot.off{background:#B9C4CD}
.mut{color:var(--ink3)} .sm{font-size:10.5px}
.right{text-align:right}
.bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:3px}

/* inspector graph strip */
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--ink3);margin-top:6px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dm{display:inline-block;width:8px;height:8px;transform:rotate(45deg);margin-right:5px;background:#fff;border:1.5px solid var(--gate);vertical-align:-1px}
@keyframes pulse{0%{stroke-opacity:.9;stroke-width:2}50%{stroke-opacity:.25;stroke-width:5}100%{stroke-opacity:.9;stroke-width:2}}
.cur{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.cur{animation:none;stroke-width:3}}

/* journal */
.jrow{display:grid;grid-template-columns:44px 74px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:11px}
.jrow:last-child{border-bottom:none}
.jseq{color:var(--ink3)} .jt{color:var(--ink3)}
.jv{font-weight:600}
.ev-gate{color:var(--gate)} .ev-eff{color:var(--rev)} .ev-await{color:var(--await)}

/* intents */
.intent{border:1px solid var(--line2);border-radius:6px;padding:9px 11px;margin-bottom:8px}
.intent.pending{border-color:#E4B7AE;background:#FBF3F1}
.intent .st{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.intent.pending .st{color:var(--err)}
.intent.done .st{color:var(--ok)}
.intent .acts{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}

/* threads */
.msg{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:8px}
.msg.out{border-left-color:var(--rev)}
.msg.in{border-left-color:var(--await)}
.msg .hd{font-size:10px;color:var(--ink3);margin-bottom:2px}
.tag{font-size:9px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--ink3)}

/* trace strip */
.shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.shot{flex:0 0 128px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.shot .ph{height:76px;background:
  repeating-linear-gradient(45deg,#EDF1F5 0 8px,#F6F8FA 8px 16px);position:relative}
.shot .ph::after{content:attr(data-n);position:absolute;left:6px;top:5px;font-size:9px;color:var(--ink3);
  background:#fff;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.shot figcaption{font-size:9.5px;padding:4px 7px;color:var(--ink2)}

/* health widgets */
.qr{width:92px;height:92px;border:1px solid var(--line);border-radius:4px;background:
  repeating-conic-gradient(#17242F 0 25%,#fff 0 50%) 0 0/14px 14px}
.timer{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:11px}
.timer:last-child{border-bottom:none}
.logline{font-size:10.5px;color:var(--ink2);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logline b{font-weight:600}
.log-warn b{color:var(--warn)} .log-err b{color:var(--err)}

/* status chips */
.lad{font-size:9.5px;padding:2px 7px;border-radius:3px;border:1px solid;font-weight:600;letter-spacing:.3px}
.lad.verified{color:var(--term);border-color:#BBDCC6;background:#EDF6F0}
.lad.suspect{color:var(--err);border-color:#E9BDB4;background:#FBF1EF}
.lad.browser{color:var(--none);border-color:var(--line);background:var(--paper)}
.lad.draft{color:var(--gate);border-color:#D8C8EE;background:#F5F0FB}

.spark{display:flex;align-items:flex-end;gap:3px;height:52px}
.spark i{display:block;width:14px;background:#C6D2DB;border-radius:2px 2px 0 0}
.spark i.hi{background:var(--irrev)}
.note{font-size:10.5px;color:var(--ink3);margin-top:6px}

@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 8px}
  .brand{display:none}
  .nav{display:flex}
  .nav button{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:8px 12px}
  .nav button.on{border-bottom-color:var(--irrev);border-left:none}
  .grid2,.grid3{grid-template-columns:1fr}
  main{padding:16px 12px 60px}
}
</style>
</head>

function graphStrip(){
  // horizontal mini-graph: car_rental madeira, current = shortlist (await), negotiate branch pending
  const W=980,H=170;
  const N=(x,y,w,label,sub,acc,extra)=>`
    <g ${extra||''}>
    <rect x="${x}" y="${y}" width="${w}" height="42" rx="4" fill="#fff" stroke="#C4CFD8" stroke-width="1.2"/>
    <rect x="${x}" y="${y}" width="4" height="42" rx="2" fill="${acc}"/>
    <text x="${x+11}" y="${y+18}" font-size="11" font-weight="600" fill="#17242F">${label}</text>
    <text x="${x+11}" y="${y+32}" font-size="8.5" fill="#4A5B69">${sub}</text></g>`;
  const E=(d,done,dash)=>`<path d="${d}" fill="none" stroke="${done?'#8B9AA6':'#D8DFE5'}"
      stroke-width="1.6" ${dash?'stroke-dasharray="4 4"':''} marker-end="url(#a2)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:900px">
   <defs><marker id="a2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
     <path d="M0,0 L8,4 L0,8 z" fill="#9AA8B4"/></marker></defs>
   ${E('M 128 51 L 158 51',1)}
   ${E('M 300 51 L 330 51',1)}
   ${E('M 458 40 C 500 20, 520 20, 556 30',1)}
   ${E('M 458 62 L 556 88',1)}
   ${E('M 700 96 C 730 96, 736 62, 758 56',0,1)}
   ${E('M 700 34 L 758 46',0)}
   ${E('M 868 51 L 900 51',0)}
   ${N(18,30,110,'discover','places · 6 found','#64748B')}
   ${N(158,30,142,'execute · search','⑂ ×5 · all replied','#64748B')}
   ${N(330,30,128,'fan-in · wait_all','5/5 · 41 s','#64748B')}
   ${N(556,14,144,'outreach.email','⑂ ×2 · negotiate','#B07A1E')}
   ${N(556,76,144,'◷ shortlist','await_input · live','#0E7C7B',
      `class=""`)}
   <rect x="553" y="73" width="150" height="48" rx="6" fill="none" stroke="#0E7C7B" class="cur"/>
   <g transform="translate(742,51) rotate(45)"><rect x="-5.5" y="-5.5" width="11" height="11" fill="#fff" stroke="#6D4AB0" stroke-width="1.6"/></g>
   ${N(758,30,110,'execute · commit','irreversible','#C13A24')}
   ${N(900,30,72,'done','voucher','#2E7D4F')}
   <g font-size="9" fill="#4A5B69">
     <text x="470" y="14">negotiate: awaiting reply</text>
     <text x="470" y="25" fill="#B07A1E">◷ 3 h 12 m left (ttl 24 h)</text>
     <text x="712" y="120" fill="#8595A2">update card (async)</text>
     <text x="716" y="44" fill="#6D4AB0" font-weight="600">gate</text>
   </g>
  </svg>`;
}
