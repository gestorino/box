# The merge bar, on every branch push and pull request: `make check` on Linux. Not on tag pushes:
# release.yml runs the same checks for a release tag.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/engine/go.mod
          cache-dependency-path: src/engine/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      # --locked: a uv.lock out of step with pyproject.toml fails here instead of being re-resolved.
      - run: uv sync --locked --directory src/browser
      - run: make check
      # The release archive, built and checked (too slow for the local merge bar).
      - run: make test-dist
